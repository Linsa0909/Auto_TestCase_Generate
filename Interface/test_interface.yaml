- name: ht8y_create_test_requirement_user_query
  notes: 创建用户查询接口测试需求
  url: /api/test/story/createTestStory
  method: post
  headers: $devops_header_with_token
  data:
    bizId: <<ht8y:product:ht8y_get_backend_product:$.ID>>
    bizType: product
    description: '<p style="text-align: start; line-height: 1.5;">接口名称：userQuery</p><p
      style="text-align: start; line-height: 1.5;">接口功能：接收客户端传入的查询条件，查询符合条件的用户信息，返回分页查询结果及总条数。</p><p
      style="text-align: start; line-height: 1.5;">输入参数：username（用户名，可选）、userId（用户ID，可选）、deptId（部门ID，可选）、postId（岗位ID，可选）、roleId（角色ID，可选）、status（用户状态，可选）、pageNum（页码，必填）、pageSize（每页条数，必填）。</p><p
      style="text-align: start; line-height: 1.5;">输出参数：code（返回码，200表示成功，非200表示失败）、msg（返回信息）、data（分页数据，包含list（用户列表，每条含用户ID、用户名、姓名等核心信息）、total（总条数）、pageNum、pageSize）。</p><p
      style="text-align: start; line-height: 1.5;">接口类型：HTTP GET</p><p style="text-align:
      start; line-height: 1.5;">接口URL：/api/system/user/list</p><p style="text-align: start;
      line-height: 1.5;">约束条件：仅管理员角色可调用，查询条件需符合规范，pageNum、pageSize为正整数；无查询结果时，data.list为空，data.total为0。</p>'
    editionId: <<ht8y:VersionSprint:ht8y_get_20_version:$.ID>>
    groupId: <<ht8y:test:ht8y_get_test_requirement_user_management_group:$.ID>>
    principalId: <<ht8y:PlatformSetting:ht8y_get_tester:$.ID>>
    priority: 3
    title: 用户查询接口
  interval_time: null
  depend_cases:
  - login
  labels: null
  expect_rc: 200
  expect_pattern:
    key_name: message
    value: OK

