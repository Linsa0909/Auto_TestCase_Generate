- name: ht8y_create_test_requirement_user_add
  notes: 创建用户新增接口测试需求
  url: /api/test/story/createTestStory
  method: post
  headers: $devops_header_with_token
  data:
    bizId: <<ht8y:product:ht8y_get_backend_product:$.ID>>
    bizType: product
    description: '<p style="text-align: start; line-height: 1.5;">接口名称：userAdd</p><p style="text-align:
      start; line-height: 1.5;">接口功能：接收客户端传入的新增用户信息，验证通过后保存用户数据及关联关系，返回操作结果。</p><p style="text-align:
      start; line-height: 1.5;">输入参数：username（用户名，必填）、name（姓名，必填）、password（密码，必填）、confirmPassword（确认密码，必填）、deptId（部门ID，必填）、postIds（岗位ID列表，必填）、roleIds（角色ID列表，必填）、phone（手机号码，可选）、email（邮箱，可选）、status（用户状态，可选，默认1启用）。</p><p
      style="text-align: start; line-height: 1.5;">输出参数：code（返回码，200表示成功，非200表示失败）、msg（返回信息，失败时说明具体原因）、data（新增用户ID，成功时返回）。</p><p
      style="text-align: start; line-height: 1.5;">接口类型：HTTP POST</p><p style="text-align:
      start; line-height: 1.5;">接口URL：/api/system/user/add</p><p style="text-align: start;
      line-height: 1.5;">约束条件：仅管理员角色可调用，输入参数需符合验证规则；用户名不可重复，密码与确认密码需一致；部门、岗位、角色ID需存在于系统中；密码需进行加密存储。</p>'
    editionId: <<ht8y:VersionSprint:ht8y_get_20_version:$.ID>>
    groupId: <<ht8y:test:ht8y_get_test_requirement_user_management_group:$.ID>>
    principalId: <<ht8y:PlatformSetting:ht8y_get_tester:$.ID>>
    priority: 3
    title: 用户新增接口
  interval_time: null
  depend_cases:
  - login
  labels: null
  expect_rc: 200
  expect_pattern:
    key_name: message
    value: OK

