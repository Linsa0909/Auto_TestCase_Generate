apiVersion: v1
kind: Namespace
metadata:
  name: test-case-intel
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: test-case-data
  namespace: test-case-intel
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-case-intel
  namespace: test-case-intel
  labels:
    app: test-case-intel
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-case-intel
  template:
    metadata:
      labels:
        app: test-case-intel
    spec:
      containers:
        - name: app
          image: test-case-intel:latest  # 替换为你的镜像地址
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/plans
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/plans
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: test-case-data
---
apiVersion: v1
kind: Service
metadata:
  name: test-case-intel
  namespace: test-case-intel
spec:
  selector:
    app: test-case-intel
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
